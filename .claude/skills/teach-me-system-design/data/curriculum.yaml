# The Architect's Road: 25-week curriculum (single source of truth for the Guide)
# Same weeks as the companion page. Links were collected from memory: verify if one fails.
# sd: 1 = weekend sandbox in systemdesigner.io

acts:
  prologue:  { n: "0",  title: "Prologue: The Workshop" }
  roads:     { n: "I",  title: "Act I: The Roads" }
  citadel:   { n: "II", title: "Act II: The Citadel" }
  designs:   { n: "III", title: "Act III: The Grand Designs" }
  uncharted: { n: "IV", title: "Act IV: The Uncharted Lands" }
  forge:     { n: "V",  title: "Act V: The Architect's Forge" }

weeks:
  - week: 0
    act: prologue
    title: Forge the Workshop
    quest: An empty plot of land and a toolbox. Nothing can be built until the workshop stands.
    concepts: [container vs virtual machine, image vs container, docker compose as a city plan, WSL2 as Linux inside Windows]
    read:
      - [Install WSL2 (Microsoft Learn), https://learn.microsoft.com/en-us/windows/wsl/install]
      - [Docker Get started, https://docs.docker.com/get-started/]
    watch: []
    build: [Install WSL2 + Docker Desktop, Create git repo "citadel" with an empty docker-compose.yml, Run hello-world then an nginx container, Start journal.md]
    boss: In three sentences from memory, what is a container and how is it different from a virtual machine?
    prediction: What do you think is actually running when Docker "starts" a container?
    loot: A working lab for the next 24 weeks.
    sd: 0

  - week: 1
    act: roads
    title: The Messenger's Handshake
    quest: A message leaves your machine. Before a single byte of the page arrives, the messengers must greet each other. How many times?
    concepts: [latency vs bandwidth, TCP three-way handshake, round trips and distance, keep-alive and connection reuse, slow start]
    read:
      - [HPBN Primer on Latency and Bandwidth, https://hpbn.co/primer-on-latency-and-bandwidth/]
      - [HPBN Building Blocks of TCP, https://hpbn.co/building-blocks-of-tcp/]
      - [System Design Primer latency numbers, https://github.com/donnemartin/system-design-primer#latency-numbers-every-programmer-should-know]
    watch:
      - [Wireshark capture of curl localhost; filter tcp.port == 80; find SYN / SYN-ACK / ACK, https://www.wireshark.org/]
    build: [Add nginx to the Citadel, curl -v it and read every line, Capture a new connection vs a reused keep-alive one]
    boss: Draw from memory everything that happens between typing a URL and seeing the page.
    prediction: How many round trips before the first byte of the response arrives?
    loot: TCP, latency and why distance matters.
    sd: 0

  - week: 2
    act: roads
    title: The Map of Names
    quest: Machines know numbers, people know names. Someone keeps the map, and someone guards the gate.
    concepts: [DNS resolution chain, TTL and caching of records, anycast, forward vs reverse proxy, why sites hide servers behind a proxy]
    read:
      - [Cloudflare What is DNS, https://www.cloudflare.com/learning/dns/what-is-dns/]
      - [System Design Primer reverse proxy, https://github.com/donnemartin/system-design-primer#reverse-proxy-web-server]
    watch:
      - [messwithdns.net, https://messwithdns.net/]
    build: [Tiny app in your language that returns its hostname, Run two copies behind nginx as reverse proxy, dig +trace example.com]
    boss: Explain forward proxy vs reverse proxy and why every large website runs the second.
    prediction: When you dig +trace, how many servers do you expect to be asked?
    loot: How a name becomes an address and how traffic reaches your servers.
    sd: 0

  - week: 3
    act: roads
    title: Tongues of the Realm
    quest: Some messengers speak once and leave, some keep the line open. Choose the right language for each errand.
    concepts: [TLS handshake cost, HTTP/1.1 head-of-line blocking, HTTP/2 multiplexing, WebSockets vs polling, gRPC and streaming]
    read:
      - [HPBN Transport Layer Security, https://hpbn.co/transport-layer-security-tls/]
      - [HPBN HTTP/2, https://hpbn.co/http2/]
      - [gRPC core concepts, https://grpc.io/docs/what-is-grpc/core-concepts/]
    watch:
      - [Browser DevTools Network panel (Protocol column, WebSocket messages), https://developer.chrome.com/docs/devtools/network]
    build: [Add a WebSocket echo endpoint, TLS on nginx with a self-signed cert, Compare curl --http1.1 and --http2]
    boss: For a live chat, a stock ticker and a file upload, choose WebSockets, polling or gRPC streaming and defend each.
    prediction: How much faster is HTTP/2 than HTTP/1.1 for a page with 50 small files, and why?
    loot: Choosing a protocol by its trade-offs.
    sd: 0

  - week: 4
    act: citadel
    title: The Gatekeepers
    quest: Your city has three workshops now, and one is slow. The gatekeeper decides who gets each visitor.
    concepts: [round robin, least connections, power of two choices, health checks, p95 vs average latency, back-of-envelope estimation]
    read:
      - [samwho.dev Load Balancing, https://samwho.dev/load-balancing/]
      - [System Design Primer load balancer, https://github.com/donnemartin/system-design-primer#load-balancer]
      - [System Design Primer appendix (powers of two, latency), https://github.com/donnemartin/system-design-primer#appendix]
    watch:
      - [samwho.dev Load Balancing simulations, https://samwho.dev/load-balancing/]
    build: [nginx upstream with three app copies with one slowed by a sleep, k6 load test round robin vs least_conn comparing p95, systemdesigner.io client to LB to servers]
    boss: 10M daily users with 20 requests each. Average and peak requests per second? How many servers at 500 req/s each?
    prediction: With one slow server, how much worse is round robin's p95 than least connections?
    loot: Load-balancing algorithms and your first estimation.
    sd: 1

  - week: 5
    act: citadel
    title: The Memory Vaults
    quest: The archive is slow. The vault remembers recent answers, but memories go stale or vanish all at once.
    concepts: [cache-aside, write-through and write-behind, TTL, eviction LRU and LFU, hit ratio, cache stampede and thundering herd, invalidation]
    read:
      - [System Design Primer cache, https://github.com/donnemartin/system-design-primer#cache]
      - [AWS Builders Library Caching challenges and strategies, https://aws.amazon.com/builders-library/caching-challenges-and-strategies/]
      - [Redis University, https://university.redis.io/]
    watch:
      - [RedisInsight, https://redis.io/insight/]
    build: [Add Redis with cache-aside on a slow endpoint, TTLs plus maxmemory 10mb allkeys-lru and read INFO stats, systemdesigner.io add a cache]
    boss: Cause a cache stampede by letting a hot key expire under k6 load, then fix it with a lock or jittered TTL.
    prediction: When the hot key expires, how many requests hit the database at once?
    loot: Caching patterns, eviction, and a stampede you caused and fixed.
    sd: 1

  - week: 6
    act: citadel
    title: The Great Archive
    quest: A million records in the archive. Without an index the archivist reads every page.
    concepts: [B-tree and B+ tree, index scan vs sequential scan, query plans, composite index column order, cost of indexes on writes, SQL vs NoSQL]
    read:
      - [Use The Index Luke Anatomy of an index, https://use-the-index-luke.com/sql/anatomy]
      - [System Design Primer database, https://github.com/donnemartin/system-design-primer#database]
    watch:
      - [USFCA B+ tree visualization, https://www.cs.usfca.edu/~galles/visualization/BPlusTree.html]
    build: [Postgres with 1M rows via generate_series, EXPLAIN ANALYZE before and after an index, systemdesigner.io SQL vs NoSQL for read-heavy]
    boss: Find a query where your index does NOT help, and explain why.
    prediction: How much faster is the indexed lookup, 2x, 100x or 10000x?
    loot: Reading query plans and understanding indexes.
    sd: 1

  - week: 7
    act: citadel
    title: The Mirrored Archives
    quest: One archive is a single point of failure. Copies help, but copies disagree for a moment.
    concepts: [leader-follower replication, sync vs async replication, replication lag, read-your-writes, sharding keys, hot shards, consistent hashing]
    read:
      - [System Design Primer RDBMS (replication federation sharding), https://github.com/donnemartin/system-design-primer#relational-database-management-system-rdbms]
      - [samwho.dev Hashing, https://samwho.dev/hashing/]
    watch: []
    build: [Postgres primary plus read replica, Write then read the replica immediately and measure lag, Pause the replica and watch it catch up]
    boss: Shard a users table of 1 billion rows. Which key? What goes wrong with one very famous user?
    prediction: How many milliseconds of replication lag on your laptop, and what could a user notice?
    loot: Replication lag, read-your-writes, shard keys and hot spots.
    sd: 1

  - week: 8
    act: citadel
    title: The Couriers' Guild
    quest: Not every task needs an answer now. The Guild carries messages so senders don't wait for receivers.
    concepts: [queue vs log, topics and partitions, keys and partition assignment, ordering per partition, decoupling and backpressure]
    read:
      - [Apache Kafka introduction, https://kafka.apache.org/intro]
      - [Confluent Developer free courses (Kafka 101), https://developer.confluent.io/courses/]
    watch:
      - [SoftwareMill Kafka visualization, https://softwaremill.com/kafka-visualisation/]
    build: [Kafka plus Kafka UI (github.com/kafbat/kafka-ui), Producer and consumer in your language, Topic with 3 partitions and keyed messages]
    boss: Why does Kafka only guarantee order inside one partition? Prove it in your lab.
    prediction: With 3 partitions and keys A B C, where does each key go, and does it stay there?
    loot: Topics, partitions, keys and decoupling.
    sd: 1

  - week: 9
    act: citadel
    title: Secrets of the Guild
    quest: The couriers can't keep up. Hire more and watch the Guild reshuffle every route.
    concepts: [consumer groups, consumer lag, rebalancing, offsets and commits, at-least-once vs exactly-once, idempotent consumers, replication factor]
    read:
      - [Kafka documentation design section, https://kafka.apache.org/documentation/#design]
      - [Confluent Developer courses, https://developer.confluent.io/courses/]
    watch:
      - [Kafka UI consumer lag view, https://github.com/kafbat/kafka-ui]
    build: [Slow consumer and watch lag grow, Add consumers and watch the rebalance, 3 brokers with replication factor 3 then stop one]
    boss: Make your consumer process a message twice, then make the processing idempotent.
    prediction: With 3 partitions, what happens when a 4th consumer joins the group?
    loot: Lag, rebalancing, delivery semantics, idempotency.
    sd: 1

  - week: 10
    act: citadel
    title: The Council of Nodes
    quest: Three elders must agree on one truth even when one falls silent.
    concepts: [leader election, terms and heartbeats, log replication, quorum and majority, split-brain, why odd cluster sizes]
    read:
      - [Raft paper sections 1-5, https://raft.github.io/raft.pdf]
    watch:
      - [The Secret Lives of Data Raft, https://thesecretlivesofdata.com/raft/]
      - [raft.github.io RaftScope, https://raft.github.io/]
    build: [3-node etcd cluster, Kill the leader and check etcdctl endpoint status, Kill 2 of 3 and try to write]
    boss: Explain why 3 nodes survive 1 failure but 4 nodes still only survive 1.
    prediction: How long does the cluster go without a leader after you kill it?
    loot: Leader election, quorum, split-brain.
    sd: 1

  - week: 11
    act: citadel
    title: The Shield Wall
    quest: One slow dependency can drag the whole city down. Build walls so one failure stays one failure.
    concepts: [timeouts, retries with exponential backoff and jitter, retry storms, circuit breaker, bulkheads, token bucket rate limiting, cascading failure]
    read:
      - [AWS Timeouts retries and backoff with jitter, https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/]
      - [Martin Fowler Circuit Breaker, https://martinfowler.com/bliki/CircuitBreaker.html]
      - [Google SRE book Addressing cascading failures, https://sre.google/sre-book/addressing-cascading-failures/]
    watch:
      - [danluu post-mortems, https://github.com/danluu/post-mortems]
    build: [docker pause Postgres during k6 load, Add timeouts then retries with backoff and jitter, Add a circuit breaker and a hand-written token bucket]
    boss: Cause a retry storm on purpose, then stop it.
    prediction: When the database pauses for 10 seconds, how long until your whole app stops responding?
    loot: Resilience patterns tested against failures you injected.
    sd: 1

  - week: 12
    act: citadel
    title: The Watchtower
    quest: You can't defend what you can't see. Build the tower and light the signal fires.
    concepts: [metrics logs traces, four golden signals, percentiles, dashboards and alerts, horizontal vs vertical scaling, autoscaling signals]
    read:
      - [Google SRE book Monitoring distributed systems, https://sre.google/sre-book/monitoring-distributed-systems/]
      - [OpenTelemetry concepts, https://opentelemetry.io/docs/concepts/]
      - [Prometheus overview, https://prometheus.io/docs/introduction/overview/]
    watch:
      - [Grafana docs, https://grafana.com/docs/grafana/latest/]
    build: [Prometheus plus Grafana, Dashboard with rate errors p95 cache hit ratio Kafka lag, Replay week 5 and 11 bosses]
    boss: Have someone inject a failure. Diagnose it from the dashboard alone.
    prediction: Which graph shows the problem first?
    loot: A complete, observable Citadel.
    sd: 1

  - week: 13
    act: designs
    title: The Short Road
    quest: A traveler wants a short name for a long road, a billion times a day.
    concepts: [requirements and numbers first, ID generation and base62, read-heavy design, caching hot links, rate limiting abuse]
    read:
      - [AFTER your design - System Design Primer Pastebin/bit.ly, https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/pastebin/README.md]
    watch:
      - [systemdesigner.io, https://systemdesigner.io/]
    build: [Design on paper in 4 steps, Rebuild it in systemdesigner.io and push traffic, Optional minimal shortener in the Citadel]
    boss: Write a one-page design doc, then compare with the reference and list every gap.
    prediction: Read-to-write ratio? Storage after 5 years?
    loot: Your first full design, made before you saw the answer.
    sd: 1

  - week: 14
    act: designs
    title: The Endless Conversation
    quest: Millions of voices expect their words to arrive instantly and in order, even to a friend who is asleep.
    concepts: [persistent connections at scale, presence, message ordering, offline delivery and inbox, fan-out to group chats, message storage]
    read:
      - [AFTER your design - How Discord stores trillions of messages, https://discord.com/blog/how-discord-stores-trillions-of-messages]
    watch:
      - [systemdesigner.io, https://systemdesigner.io/]
    build: [Design first, Prototype with your week 3 WebSocket app plus week 8 Kafka]
    boss: How does a message reach a user who is offline, or connected to a different server?
    prediction: Where is the hardest part of this system?
    loot: Real-time delivery, presence, message storage.
    sd: 1

  - week: 15
    act: designs
    title: The Town Crier
    quest: A celebrity speaks and fifty million followers must hear. Shout at once, or let them come and listen?
    concepts: [fan-out on write, fan-out on read, hybrid for celebrities, feed ranking at a high level, notification pipelines]
    read:
      - [AFTER your design - System Design Primer Twitter timeline, https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/twitter/README.md]
    watch:
      - [systemdesigner.io, https://systemdesigner.io/]
    build: [Design first, Compare fan-out on write vs read in systemdesigner.io]
    boss: Design the feed for a celebrity with 50M followers. What changes from a normal user?
    prediction: Which breaks first at celebrity scale, writes or reads?
    loot: Fan-out trade-offs and interview-level design skill.
    sd: 1

  - week: 16
    act: uncharted
    title: The Treaty Halls
    quest: Every system speaks to others through treaties. A bad treaty lasts forever.
    concepts: [resource-oriented APIs, cursor vs offset pagination, idempotency keys, versioning, data modeling for access patterns, preventing double booking]
    read:
      - [Google API design guide, https://cloud.google.com/apis/design]
      - [Stripe Designing robust APIs with idempotency, https://stripe.com/blog/idempotency]
    watch: []
    build: [Cursor pagination on your API, Idempotency keys on a create endpoint and send the same request twice]
    boss: Design the schema and API for a booking system that can never double-book.
    prediction: What breaks with offset pagination when new rows keep arriving?
    loot: APIs that survive retries and growth.
    sd: 1

  - week: 17
    act: uncharted
    title: The Far Warehouses
    quest: Big things live far away - videos, images, and the index that lets you find anything.
    concepts: [object storage vs block vs file, presigned URLs, CDN edge caching and invalidation, inverted index, search relevance basics]
    read:
      - [Cloudflare What is a CDN, https://www.cloudflare.com/learning/cdn/what-is-a-cdn/]
      - [System Design Primer CDN, https://github.com/donnemartin/system-design-primer#content-delivery-network]
      - [Meilisearch docs, https://www.meilisearch.com/docs]
    watch: []
    build: [MinIO (min.io) with uploads through presigned URLs, Meilisearch indexing your shortened URLs]
    boss: Where does a 2 GB video upload go, and how does a viewer in Vietnam get it fast?
    prediction: Why shouldn't large files go through your app servers?
    loot: Blob storage, CDNs, inverted indexes.
    sd: 1

  - week: 18
    act: uncharted
    title: The Locksmiths
    quest: A city with no locks is a city for thieves. Learn how the locks work.
    concepts: [authentication vs authorization, password hashing, sessions vs JWT, OAuth 2 flows, OWASP top risks, rate limiting login]
    read:
      - [OWASP Top 10, https://owasp.org/Top10/]
      - [OAuth 2 Simplified, https://aaronparecki.com/oauth-2-simplified/]
      - [jwt.io introduction, https://jwt.io/introduction]
    watch:
      - [jwt.io debugger, https://jwt.io/]
    build: [Login with JWT, Hash passwords with bcrypt or argon2, Rate-limit the login endpoint]
    boss: Find three ways to attack your OWN app, then close them.
    prediction: What can someone do with a stolen JWT, and for how long?
    loot: Auth, authz, and the most common holes.
    sd: 0

  - week: 19
    act: uncharted
    title: Across the Seas
    quest: Your empire spans oceans. Messages take time, and no single ledger can be everywhere at once.
    concepts: [saga pattern and compensation, event sourcing, CQRS, multi-region latency, CAP and PACELC, conflict resolution]
    read:
      - [microservices.io Saga, https://microservices.io/patterns/data/saga.html]
      - [Martin Fowler Event Sourcing, https://martinfowler.com/eaaDev/EventSourcing.html]
      - [Martin Fowler CQRS, https://martinfowler.com/bliki/CQRS.html]
      - [Amazon Dynamo paper, https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf]
    watch: []
    build: [Order saga across two services over Kafka, Latency between regions with Toxiproxy (github.com/Shopify/toxiproxy)]
    boss: A user in Vietnam and one in the US edit the same record at once. Consistency or speed? Defend it.
    prediction: What happens to your saga if step 2 fails after step 1 succeeded?
    loot: Distributed transactions without 2PC and the cost of distance.
    sd: 1

  - week: 20
    act: forge
    title: Study the Masters
    quest: Before forging your own blade, study other smiths' work by holding it, not by breaking into their forge.
    concepts: [lesson flow design, what to simulate vs fake, feedback loops in learning, product brief]
    read:
      - [Your own journal from weeks 1-19, local]
    watch:
      - [fivenines.dev free chapter as a normal user, https://fivenines.dev/]
      - [Server Survival, https://pshenok.github.io/server-survival/]
      - [systemdesigner.io, https://systemdesigner.io/]
    build: [Teardown notes on lesson flow and what is simulated vs faked, No reverse engineering of code or content]
    boss: Write a one-page brief for YOUR original simulator - audience and first 5 lessons.
    prediction: Which lesson from this road would have helped you most as a game?
    loot: A product vision that is yours.
    sd: 1

  - week: 21
    act: forge
    title: The Mathematics of Waiting
    quest: Every line at every gate obeys the same law. Learn it and you can predict the crowd.
    concepts: [arrival rate and service rate, utilization, Little's Law, M/M/1 intuition, why latency explodes near saturation]
    read:
      - [Sam Rose Queueing an interactive study, https://encore.dev/blog/queueing]
      - [Little's Law, https://en.wikipedia.org/wiki/Little%27s_law]
    watch: []
    build: [Simulate one server with random arrivals in your language, Plot latency vs utilization and compare with week 4]
    boss: Explain why latency explodes past about 80% utilization.
    prediction: At 90% utilization, how many times worse is the wait than at 50%?
    loot: The math under every simulator.
    sd: 0

  - week: 22
    act: forge
    title: The Clockwork Engine
    quest: Time in a simulation is a list of events waiting their turn. Build the clock.
    concepts: [discrete-event simulation, event queue as priority queue, simulated clock vs wall clock, modeling components, validation against reality]
    read:
      - [SimPy docs (ideas only), https://simpy.readthedocs.io/]
    watch: []
    build: [Tiny event engine with a time-ordered priority queue, Model LB plus 2 servers plus cache, Reproduce week 4 and 5 lab results]
    boss: Your simulation and your real lab disagree. Find out why.
    prediction: Which real-world effect will your first simulation forget?
    loot: A simulation engine you fully understand.
    sd: 0

  - week: 23
    act: forge
    title: Reading the Old Maps
    quest: Others walked part of this road. Read their maps where they invite you, then draw your own.
    concepts: [reading unfamiliar codebases, Web Worker for simulation, rendering on canvas, lessons as data, architecture decision records]
    read:
      - [Open-source simulator repos from your research (check licenses), local]
    watch: []
    build: [Architecture doc for your simulator, 3 ADRs with trade-offs]
    boss: Defend your 3 decisions against the Guide acting as a hostile reviewer.
    prediction: Which part will be the hardest to build?
    loot: A design for your own product.
    sd: 0

  - week: 24
    act: forge
    title: The First Stone
    quest: Every city began with a single stone. Lay yours.
    concepts: [vertical slice, playtesting, learning from observation]
    read: []
    watch: []
    build: [One playable load-balancing lesson in your own style, Backed by your week 22 engine]
    boss: Give it to a friend and watch them play without helping. Write down every moment they get stuck.
    prediction: Where will your friend get stuck first?
    loot: You are now an architect who builds.
    sd: 0
